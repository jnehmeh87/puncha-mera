{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="card">
  <div class="card-header">
    <h1 class="card-title">Edit Member Permissions</h1>
  </div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% crispy form %}
      <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
  </div>
</div>
{% endblock %}
