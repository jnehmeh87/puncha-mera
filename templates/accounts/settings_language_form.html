{% load crispy_forms_tags %}
<div class="modal-header border-bottom-0 pb-0">
    <h5 class="modal-title h3 fw-bold bg-gradient-text" id="edit-modal-label">Edit Language</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<div class="modal-body pt-4 pb-5 px-4 px-md-5">
    <form method="post" action="{% url 'accounts:settings-language-edit' %}">
        {% csrf_token %}
        <div class="mb-4">
            {{ form|crispy }}
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4 pt-4 border-top">
            <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary btn-premium px-4">Save Changes</button>
        </div>
    </form>
</div>
