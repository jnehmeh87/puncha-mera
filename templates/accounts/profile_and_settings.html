{% extends 'base.html' %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-opacity-10">
        <h1 class="h2 fw-bolder mb-0 bg-gradient-text">Account Settings</h1>
    </div>

    <div class="row g-4">
        <div class="col-lg-3 col-md-4">
            <div class="card shadow-sm border-0 dashboard-card p-2 sticky-top" style="top: 100px; z-index: 10;">
                <div class="nav flex-column nav-pills custom-nav-pills" role="tablist" aria-orientation="vertical">
                    <a class="nav-link active d-flex align-items-center mb-1" id="v-pills-profile-tab"
                        data-bs-toggle="pill" href="#profile" role="tab" aria-controls="profile" aria-selected="true">
                        <i class="bi bi-person-circle fs-5 me-3"></i>
                        <span class="fw-medium">Profile</span>
                    </a>
                    <a class="nav-link d-flex align-items-center" id="v-pills-settings-tab" data-bs-toggle="pill"
                        href="#settings" role="tab" aria-controls="settings" aria-selected="false">
                        <i class="bi bi-sliders fs-5 me-3"></i>
                        <span class="fw-medium">Settings</span>
                    </a>
                </div>
            </div>
        </div>

        <div class="col-lg-9 col-md-8">
            <div class="tab-content" id="v-pills-tabContent">
                <div class="tab-pane fade show active" id="profile" role="tabpanel"
                    aria-labelledby="v-pills-profile-tab">
                    {% include 'accounts/profile.html' %}
                </div>
                <div class="tab-pane fade" id="settings" role="tabpanel" aria-labelledby="v-pills-settings-tab">
                    {% include 'accounts/settings.html' %}
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* Custom sleek nav pills for the sidebar */
    .custom-nav-pills .nav-link {
        color: var(--text-color);
        border-radius: 0.75rem;
        padding: 0.8rem 1.25rem;
        transition: all 0.2s ease-in-out;
        opacity: 0.8;
    }

    .custom-nav-pills .nav-link:hover {
        background-color: rgba(var(--text-color-rgb), 0.05);
        opacity: 1;
    }

    .custom-nav-pills .nav-link.active {
        background-color: color-mix(in srgb, var(--primary-color) 15%, transparent) !important;
        color: var(--primary-color) !important;
        opacity: 1;
        font-weight: 600;
    }
</style>

<div class="modal fade" id="edit-modal" tabindex="-1" role="dialog" aria-labelledby="edit-modal-label"
    aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="edit-modal-label">Edit</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                ...
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    $(document).ready(function () {
        $(".edit-btn").click(function () {
            var url = $(this).data("url");
            $.get(url, function (data) {
                var form = $(data).find("form");
                $("#edit-modal .modal-body").html(form);

                const theme = localStorage.getItem('theme');
                if (theme === 'dark') {
                    $('#edit-modal .modal-content').addClass('text-bg-dark');
                    $('#edit-modal .btn-close').addClass('btn-close-white');
                }

                $("#edit-modal").modal("show");
                initAutocomplete(); // Call initAutocomplete after the form is loaded
            });
        });
    });

    function initAutocomplete() {
        const addressInput = document.getElementById('id_address');
        if (addressInput) { // Check if the address field is present
            addressInput.removeAttribute('disabled');
            addressInput.removeAttribute('readonly');
            const autocomplete = new google.maps.places.Autocomplete(addressInput, {
                types: ['address']
            });

            autocomplete.addListener('place_changed', () => {
                const place = autocomplete.getPlace();

                if (place.address_components) {
                    let country = '';
                    let county_region = '';
                    let postal_code = '';

                    for (const component of place.address_components) {
                        const componentType = component.types[0];

                        switch (componentType) {
                            case 'postal_code':
                                postal_code = component.long_name;
                                break;
                            case 'administrative_area_level_1':
                                county_region = component.long_name;
                                break;
                            case 'country':
                                country = component.long_name;
                                break;
                        }
                    }

                    document.getElementById('id_address').value = place.formatted_address;
                    document.getElementById('id_country').value = country;
                    document.getElementById('id_county_region').value = county_region;
                    document.getElementById('id_postal_code').value = postal_code;
                }
            });
        }
    }
</script>
{% endblock %}
