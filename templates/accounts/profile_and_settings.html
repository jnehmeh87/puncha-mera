{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-3">
            <div class="list-group">
                <a href="#profile" class="list-group-item list-group-item-action active" data-bs-toggle="tab">Profile</a>
                <a href="#settings" class="list-group-item list-group-item-action" data-bs-toggle="tab">Settings</a>
            </div>
        </div>
        <div class="col-md-9">
            <div class="tab-content">
                <div class="tab-pane fade show active" id="profile">
                    {% include 'accounts/profile.html' %}
                </div>
                <div class="tab-pane fade" id="settings">
                    {% include 'accounts/settings.html' %}
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="edit-modal" tabindex="-1" role="dialog" aria-labelledby="edit-modal-label" aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="edit-modal-label">Edit</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        ...
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
$(document).ready(function(){
  $(".edit-btn").click(function(){
    var url = $(this).data("url");
    $.get(url, function(data){
      var form = $(data).find("form");
      $("#edit-modal .modal-body").html(form);

      const theme = localStorage.getItem('theme');
      if (theme === 'dark') {
          $('#edit-modal .modal-content').addClass('text-bg-dark');
          $('#edit-modal .btn-close').addClass('btn-close-white');
      }

      $("#edit-modal").modal("show");
      initAutocomplete(); // Call initAutocomplete after the form is loaded
    });
  });
});

function initAutocomplete() {
    const addressInput = document.getElementById('id_address');
    if (addressInput) { // Check if the address field is present
        addressInput.removeAttribute('disabled');
        addressInput.removeAttribute('readonly');
        const autocomplete = new google.maps.places.Autocomplete(addressInput, {
            types: ['address']
        });

        autocomplete.addListener('place_changed', () => {
            const place = autocomplete.getPlace();

            if (place.address_components) {
                let country = '';
                let county_region = '';
                let postal_code = '';

                for (const component of place.address_components) {
                    const componentType = component.types[0];

                    switch (componentType) {
                        case 'postal_code':
                            postal_code = component.long_name;
                            break;
                        case 'administrative_area_level_1':
                            county_region = component.long_name;
                            break;
                        case 'country':
                            country = component.long_name;
                            break;
                    }
                }

                document.getElementById('id_address').value = place.formatted_address;
                document.getElementById('id_country').value = country;
                document.getElementById('id_county_region').value = county_region;
                document.getElementById('id_postal_code').value = postal_code;
            }
        });
    }
}
</script>
{% endblock %}
