services:
  - type: web
    name: puncha-mera
    env: python
    buildCommand: "./build.sh"
    startCommand: "./run.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: puncha-mera-db
          property: connectionString

databases:
  - name: puncha-mera-db
    databaseName: punchamera
    user: punchamera
